services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logos-rc-web
    restart: unless-stopped
    ports:
      - "6321:80"
    depends_on:
      ws:
        condition: service_healthy
    networks:
      - logos-net

  ws:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: logos-rc-ws
    restart: unless-stopped
    ports:
      - "6322:6322"
    environment:
      - NODE_ENV=production
      - WS_PORT=6322
    networks:
      - logos-net

networks:
  logos-net:
    driver: bridge
